<!DOCTYPE html>
<!--
  《指尖交响》 A Symphony at Your Fingertips
  ------------------------------------------------------------
  举起手，在空中弹奏一首曲子；指尖划过的轨迹被画成一幅画；
  演奏结束后，音乐与画作合成一张可分享的电子贺卡。

  运行方式：无需编译。用 Chrome / Edge 浏览器直接打开本文件即可（需联网加载手势识别模型）。
  技术栈：原生 HTML + Canvas 2D + Web Audio API，手势识别使用 Google MediaPipe Hand Landmarker。

  代码结构：
    0. 全局状态与画布
    1. 音乐引擎 —— 用 Web Audio 从零合成音色（不使用任何音频文件）
    2. 绘画引擎 —— 把每个音符变成光的轨迹、花朵与粒子
    3. 三种输入 —— 摄像头手势 / 鼠标 / 自动演奏
    4. 录制与编码 —— 把整场演奏压缩进一条网址
    5. 贺卡生成 —— 画作 + 祝福 + 二维码
    6. 主流程
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>指尖交响</title>
<script src="vendor/qrcode.min.js"></script>
<style>
  :root { --gold: #f5d38a; --ink: #e8ecff; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: #05081a; color: var(--ink);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #fx { pointer-events: none; }
  #cam { position: fixed; right: 16px; bottom: 16px; width: 180px; border-radius: 10px; transform: scaleX(-1);
    opacity: 0; transition: opacity .6s; pointer-events: none; z-index: 4; }
  #cam.on { opacity: .3; }
  .panel { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; padding: 24px; text-align: center;
    background: radial-gradient(ellipse at center, rgba(10,16,48,.55), rgba(3,5,16,.92)); }
  .panel.soft { background: rgba(3,5,16,.55); backdrop-filter: blur(2px); }
  .panel[hidden], #hud[hidden] { display: none; }
  h1 { font-size: clamp(44px, 9vw, 96px); font-weight: 300; letter-spacing: .25em; padding-left: .25em;
    background: linear-gradient(90deg, #8ec5ff, #f5a3d8, #f5d38a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h2 { font-weight: 400; letter-spacing: .1em; }
  .sub { opacity: .6; letter-spacing: .35em; font-size: 13px; }
  .desc { opacity: .8; line-height: 2; max-width: 560px; }
  .small { opacity: .55; font-size: 13px; line-height: 1.8; }
  .btns { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  button { font: inherit; color: var(--ink); background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.25);
    padding: 12px 26px; border-radius: 999px; cursor: pointer; transition: .2s; }
  button:hover { background: rgba(255,255,255,.15); border-color: var(--gold); }
  button.main { border-color: var(--gold); color: var(--gold); }
  label { display: flex; gap: 12px; align-items: center; width: min(460px, 90vw); }
  label span { width: 3em; opacity: .7; flex: none; }
  input { flex: 1; font: inherit; color: var(--ink); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2);
    border-radius: 8px; padding: 10px 14px; outline: none; }
  input:focus { border-color: var(--gold); }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #hud .top { position: absolute; top: 16px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; }
  #hud .logo { letter-spacing: .3em; opacity: .7; }
  #hud .tip { position: absolute; bottom: 24px; left: 0; right: 0; font-size: 14px; opacity: .7; text-align: center; letter-spacing: .05em; }
  #hud button { pointer-events: auto; padding: 8px 20px; margin-left: 12px; }
  #cardImg { max-width: min(92vw, 1100px); max-height: 68vh; border-radius: 12px; box-shadow: 0 20px 80px rgba(0,0,0,.7); }
  #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 20; background: rgba(0,0,0,.7);
    padding: 10px 20px; border-radius: 999px; font-size: 14px; opacity: 0; transition: .4s; pointer-events: none; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="art"></canvas>
<canvas id="fx"></canvas>
<video id="cam" playsinline muted></video>

<div id="hud" hidden>
  <div class="top"><span class="logo">指尖交响</span><span><span id="stat"></span><button id="songPause" hidden>暂停</button><button id="songPaintAll" hidden>生成完整画作</button><button id="songDownload" hidden>保存《画沙》音频</button><button id="doneBtn">完成 ✓</button></span></div>
  <div class="tip" id="tip"></div>
</div>

<div id="start" class="panel">
  <div class="sub">A SYMPHONY AT YOUR FINGERTIPS</div>
  <h1>指尖交响</h1>
  <p class="desc">举起你的手，在空中弹奏一首只属于你的曲子。<br>指尖划过的轨迹会变成一幅画，<br>最后合成一张贺卡，送给你最想祝福的人。</p>
  <div class="btns">
    <button class="main" data-mode="hand">✋ 用手演奏</button>
    <button data-mode="mouse">🖱 用鼠标演奏</button>
    <button data-mode="auto">▶ 自动演奏</button>
    <button class="main" id="huashaBtn">♫ 演奏《画沙》</button>
    <button class="main" id="specialPersonBtn">♫ 演奏《特别的人》</button>
  </div>
  <p class="small" id="loading">建议佩戴耳机或打开音量 · 手势模式需要摄像头</p>
</div>

<div id="form" class="panel soft" hidden>
  <h2>你的曲子完成了</h2>
  <p class="small" id="formStat"></p>
  <label><span>送给</span><input id="fTo" maxlength="12" value="你"></label>
  <label><span>祝福</span><input id="fMsg" maxlength="40" value="愿你的每一天，都像这首曲子一样闪闪发光。"></label>
  <label><span>落款</span><input id="fFrom" maxlength="12" value="一个写代码的人"></label>
  <div class="btns"><button class="main" id="makeCard">生成贺卡</button><button class="again">重新演奏</button></div>
</div>

<div id="card" class="panel soft" hidden>
  <img id="cardImg" alt="贺卡">
  <div class="btns">
    <button class="main" id="saveBtn">保存贺卡</button>
    <button id="copyBtn">复制分享链接</button>
    <button class="again">再弹一首</button>
  </div>
  <p class="small" id="linkNote"></p>
</div>

<div id="env" class="panel" hidden>
  <div class="sub">YOU'VE GOT A SONG</div>
  <h2 id="envTitle"></h2>
  <p class="desc" id="envDesc"></p>
  <button class="main" id="openBtn">✉ 轻触打开并播放</button>
  <p class="small" id="playHint">轻触按钮，聆听旋律并观看画作。请打开手机音量。</p>
</div>

<div id="toast"></div>

<script>
/* ============================================================
 * 0. 全局状态与画布
 *    三层画布：bg 星空背景 / art 永久保留的画作 / fx 每帧重绘的特效（粒子、光标、骨架）
 * ============================================================ */
const $ = s => document.querySelector(s);
const bg = $('#bg'), art = $('#art'), fx = $('#fx');
const bctx = bg.getContext('2d'), actx = art.getContext('2d'), fctx = fx.getContext('2d');
const DPR = Math.min(devicePixelRatio || 1, 2);
const NOTE_NAMES = ['Do', 'Re', 'Mi', 'Sol', 'La'];
const S = { mode: 'idle', src: null, smooth: null, prevPinch: false, prevOpen: false, lastStep: -1,
            lastNoteT: 0, vT: 0, t0: 0, notes: 0, lifted: true, aspect: 16 / 9 };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const stepOf = y => clamp(Math.floor((1 - y) * 15), 0, 14);   // 纵坐标 → 音阶序号（越高音越高）

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.opacity = 1; setTimeout(() => t.style.opacity = 0, 2600); }

// 在点击处理器内立即恢复音频，并发出静音采样，兼容手机 WebView 的音频启动限制。
async function unlockAudio(context) {
  const resumed = context.resume();
  const silent = context.createBufferSource();
  silent.buffer = context.createBuffer(1, 1, context.sampleRate);
  silent.connect(context.destination);
  silent.onended = () => silent.disconnect();
  silent.start(0);
  let timer;
  try {
    await Promise.race([resumed, new Promise((_, reject) => {
      timer = setTimeout(() => reject(new Error('音频尚未启动，请再次轻触播放')), 5000);
    })]);
    if (context.state !== 'running') throw new Error('音频尚未启动，请再次轻触播放');
  } finally { clearTimeout(timer); }
}

async function openSharedSong(play) {
  const button = $('#openBtn');
  if (button.disabled) return;
  button.disabled = true; button.textContent = '正在准备音乐…';
  try { await play(); }
  catch (e) {
    console.error(e);
    $('#env').hidden = false;
    $('#playHint').textContent = '播放未能启动，请检查音量后再次轻触。如仍无声音，可在右上角选择在浏览器中打开。';
    toast('播放未能启动，请再次轻触播放');
  } finally {
    button.disabled = false; button.textContent = '✉ 轻触打开并播放';
  }
}

function resize() {
  const keep = document.createElement('canvas');       // 改变窗口大小时保留已画的内容
  keep.width = art.width; keep.height = art.height; keep.getContext('2d').drawImage(art, 0, 0);
  for (const c of [bg, art, fx]) {
    c.width = innerWidth * DPR; c.height = innerHeight * DPR;
    c.getContext('2d').setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  if (keep.width && keep.height) actx.drawImage(keep, 0, 0, keep.width / DPR, keep.height / DPR);
  fitView(S.mode === 'replay' ? S.aspect : innerWidth / innerHeight);
  drawBackground();
}

// 画作区域：现场演奏时为全屏；回放时按原始长宽比居中适配（手机竖屏也不变形）
function fitView(a) {
  const W = innerWidth, H = innerHeight;
  Painter.view = W / H > a ? { w: H * a, h: H, x: (W - H * a) / 2, y: 0 }
                           : { w: W, h: W / a, x: 0, y: (H - W / a) / 2 };
}

function drawBackground() {
  const W = innerWidth, H = innerHeight;
  const g = bctx.createRadialGradient(W / 2, H * 0.6, 0, W / 2, H * 0.6, Math.max(W, H) * 0.8);
  g.addColorStop(0, '#111a44'); g.addColorStop(1, '#03050f');
  bctx.fillStyle = g; bctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 260; i++) {
    bctx.fillStyle = `rgba(200,215,255,${Math.random() * 0.6})`;
    bctx.beginPath(); bctx.arc(Math.random() * W, Math.random() * H, Math.random() * 1.2, 0, 7); bctx.fill();
  }
}

/* ============================================================
 * 1. 音乐引擎
 *    - 音阶：C 大调五声音阶（Do Re Mi Sol La），共 3 个八度 15 个音。
 *      五声音阶没有半音，任意组合都和谐 —— 所以"怎么弹都好听"。
 *    - 音色：三角波 + 两个泛音正弦波，配合快起慢落的包络，接近钢片琴 / 拇指琴。
 *    - 空间感：用"指数衰减的白噪声"现场生成混响脉冲，再加一路回声；
 *      手在屏幕左右的位置决定声音在左右声道的位置。
 * ============================================================ */
const Audio = {
  ctx: null,
  init() {
    if (this.ctx) return;
    const ctx = this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor(); comp.connect(ctx.destination);
    this.out = ctx.createGain(); this.out.gain.value = 0.8; this.out.connect(comp);

    const len = ctx.sampleRate * 3, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    }
    this.rev = ctx.createConvolver(); this.rev.buffer = ir;
    const wet = ctx.createGain(); wet.gain.value = 0.45; this.rev.connect(wet); wet.connect(comp);

    this.delay = ctx.createDelay(); this.delay.delayTime.value = 0.36;
    const fb = ctx.createGain(); fb.gain.value = 0.28;
    this.delay.connect(fb); fb.connect(this.delay); this.delay.connect(this.rev);
    this.drone();
  },
  freq(i) { const st = [0, 2, 4, 7, 9]; return 261.63 * Math.pow(2, (Math.floor(i / 5) * 12 + st[i % 5]) / 12); },

  // 演奏一个音：i 为音阶序号，pan 为左右声道（-1 ~ 1），when 为延迟秒数
  note(i, vel = 1, pan = 0, when = 0) {
    const ctx = this.ctx, t = ctx.currentTime + when, f = this.freq(i);
    const env = ctx.createGain();
    env.gain.setValueAtTime(0.0001, t);
    env.gain.exponentialRampToValueAtTime(0.22 * vel, t + 0.008);
    env.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);
    const p = ctx.createStereoPanner(); p.pan.value = clamp(pan, -1, 1);
    env.connect(p); p.connect(this.out); p.connect(this.rev); p.connect(this.delay);
    for (const [mul, type, amp] of [[1, 'triangle', 1], [2, 'sine', 0.35], [3.01, 'sine', 0.1]]) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = f * mul; g.gain.value = amp;
      o.connect(g); g.connect(env); o.start(t); o.stop(t + 2.5);
    }
  },
  // 和弦：以当前音为根，按五声音阶隔一取一堆叠，略微错开形成"琶音"，再加一个低音
  chord(i, pan = 0) {
    const root = Math.max(0, i - 2);
    [0, 2, 4, 7].forEach((k, j) => { if (root + k < 15) this.note(root + k, 0.7, pan, j * 0.06); });
    const ctx = this.ctx, t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = this.freq(root % 5) / 2;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 3);
    o.connect(g); g.connect(this.out); g.connect(this.rev); o.start(t); o.stop(t + 3.1);
  },
  // 背景氛围音：三个低频锯齿波经过低通滤波器，滤波频率被一个极慢的振荡器推动，像在"呼吸"
  drone() {
    const ctx = this.ctx, g = ctx.createGain(), lp = ctx.createBiquadFilter();
    g.gain.setValueAtTime(0, ctx.currentTime); g.gain.linearRampToValueAtTime(0.03, ctx.currentTime + 4);
    lp.type = 'lowpass'; lp.frequency.value = 500; lp.connect(g); g.connect(this.out); g.connect(this.rev);
    for (const f of [65.41, 98, 130.81]) {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = Math.random() * 12 - 6;
      o.connect(lp); o.start();
    }
    const lfo = ctx.createOscillator(), lg = ctx.createGain();
    lfo.frequency.value = 0.07; lg.gain.value = 300; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  }
};

/* ============================================================
 * 2. 绘画引擎
 *    - 声音与颜色一一对应：低音为深蓝，越往高音越偏向紫、粉、金。
 *    - 轨迹：用"中点二次贝塞尔曲线"连接采样点，使线条平滑；
 *      多层不同粗细、不同透明度的线叠加（lighter 混合模式）形成发光效果。
 *    - 单音 → 在画上留下一朵花；和弦 → 留下一个曼陀罗光环，并爆发粒子。
 * ============================================================ */
const Painter = {
  view: { x: 0, y: 0, w: 1, h: 1 }, pts: [], parts: [], rings: [],
  hue: i => (205 + i * 11) % 360,
  k() { return Math.min(this.view.w, this.view.h) / 800; },          // 尺寸随屏幕缩放
  toScreen(p) { return { x: this.view.x + p.x * this.view.w, y: this.view.y + p.y * this.view.h }; },
  lift() { this.pts = []; },

  stroke(np, step, pressed) {
    const p = this.toScreen(np), pts = this.pts;
    if (pts.length && Math.hypot(p.x - pts[pts.length - 1].x, p.y - pts[pts.length - 1].y) < 0.8) return;
    pts.push(p); if (pts.length > 3) pts.shift();
    if (pts.length < 3) return;
    const [a, b, c] = pts, k = this.k(), h = this.hue(step);
    const m1 = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, m2 = { x: (b.x + c.x) / 2, y: (b.y + c.y) / 2 };
    const thin = clamp(1.4 - Math.hypot(c.x - b.x, c.y - b.y) / 80, 0.5, 1.4);   // 越快越细，像毛笔
    const layers = pressed ? [[20, 0.04], [8, 0.1], [2.2, 0.7]] : [[6, 0.025], [1.2, 0.22]];
    actx.save(); actx.globalCompositeOperation = 'lighter'; actx.lineCap = 'round';
    for (const [w, al] of layers) {
      actx.strokeStyle = `hsla(${h},90%,${pressed ? 65 : 78}%,${al})`;
      actx.lineWidth = w * k * (pressed ? thin : 1);
      actx.beginPath(); actx.moveTo(m1.x, m1.y); actx.quadraticCurveTo(b.x, b.y, m2.x, m2.y); actx.stroke();
    }
    actx.restore();
  },

  bloom(np, i) {                         // 单音：花瓣数与大小由音高决定
    const p = this.toScreen(np), h = this.hue(i), n = 5 + i % 4, r = (16 + i * 1.6) * this.k();
    actx.save(); actx.globalCompositeOperation = 'lighter'; actx.translate(p.x, p.y); actx.rotate(Math.random() * 7);
    actx.fillStyle = `hsla(${h},90%,70%,0.12)`;
    for (let j = 0; j < n; j++) {
      actx.rotate(Math.PI * 2 / n);
      actx.beginPath(); actx.ellipse(r * 0.6, 0, r * 0.6, r * 0.2, 0, 0, 7); actx.fill();
    }
    const g = actx.createRadialGradient(0, 0, 0, 0, 0, r * 0.5);
    g.addColorStop(0, `hsla(${h},100%,92%,0.9)`); g.addColorStop(1, `hsla(${h},100%,60%,0)`);
    actx.fillStyle = g; actx.beginPath(); actx.arc(0, 0, r * 0.5, 0, 7); actx.fill();
    actx.restore();
    this.spawn(p, h, 14, 2.5); this.rings.push({ ...p, h, r: 4, max: r * 3 });
  },

  burst(np, i) {                         // 和弦：放射状光线 + 同心圆，像烟花在画布上留下的印记
    const p = this.toScreen(np), h = this.hue(i), k = this.k(), R = (90 + i * 4) * k;
    actx.save(); actx.globalCompositeOperation = 'lighter'; actx.translate(p.x, p.y);
    for (let j = 0; j < 48; j++) {
      const a = j / 48 * Math.PI * 2, r0 = R * (0.25 + 0.1 * (j % 3)), r1 = R * (0.6 + 0.4 * Math.random());
      actx.strokeStyle = `hsla(${h + (j % 4) * 15},90%,70%,0.18)`; actx.lineWidth = 1.2 * k;
      actx.beginPath(); actx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); actx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1); actx.stroke();
    }
    for (const rr of [0.3, 0.55, 0.8]) {
      actx.strokeStyle = `hsla(${h},90%,75%,0.15)`; actx.beginPath(); actx.arc(0, 0, R * rr, 0, 7); actx.stroke();
    }
    actx.restore();
    this.spawn(p, h, 80, 6); this.rings.push({ ...p, h, r: 10, max: R * 2.2 });
  },

  spawn(p, h, n, sp) {
    for (let j = 0; j < n; j++) {
      const a = Math.random() * 7, v = Math.random() * sp + 0.5;
      this.parts.push({ x: p.x, y: p.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, h: h + Math.random() * 40 - 20, life: 1 });
    }
  },

  // 每帧更新特效层：涟漪向外扩散，粒子受阻力减速并逐渐消失
  updateFx() {
    fctx.save(); fctx.globalCompositeOperation = 'lighter';
    this.rings = this.rings.filter(r => {
      r.r += (r.max - r.r) * 0.06;
      const al = 1 - r.r / r.max;
      fctx.strokeStyle = `hsla(${r.h},90%,75%,${al * 0.8})`; fctx.lineWidth = 2;
      fctx.beginPath(); fctx.arc(r.x, r.y, r.r, 0, 7); fctx.stroke();
      return al > 0.03;
    });
    this.parts = this.parts.filter(q => {
      q.x += q.vx; q.y += q.vy; q.vx *= 0.96; q.vy = q.vy * 0.96 + 0.03; q.life -= 0.015;
      fctx.fillStyle = `hsla(${q.h},100%,75%,${q.life})`;
      fctx.beginPath(); fctx.arc(q.x, q.y, 2 * q.life + 0.5, 0, 7); fctx.fill();
      return q.life > 0;
    });
    fctx.restore();
  },

  // 左侧音阶刻度：让演奏者知道"手放在哪里是哪个音"
  drawGuide(cur) {
    const v = this.view;
    fctx.font = '11px sans-serif'; fctx.textBaseline = 'middle';
    for (let i = 0; i < 15; i++) {
      const y = v.y + (1 - (i + 0.5) / 15) * v.h, on = i === cur;
      fctx.fillStyle = on ? `hsla(${this.hue(i)},90%,75%,0.9)` : 'rgba(200,210,255,0.22)';
      fctx.fillText(NOTE_NAMES[i % 5] + '·'.repeat(Math.floor(i / 5) + 1), v.x + 14, y);
      if (on) fctx.fillRect(v.x + 58, y - 0.5, v.w - 116, 1);
    }
  },

  drawCursor(np, step, pressed, hold) {
    const p = this.toScreen(np), h = this.hue(step), r = pressed ? 16 : 10;
    const g = fctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 2.5);
    g.addColorStop(0, `hsla(${h},100%,90%,0.9)`); g.addColorStop(1, `hsla(${h},100%,60%,0)`);
    fctx.fillStyle = g; fctx.beginPath(); fctx.arc(p.x, p.y, r * 2.5, 0, 7); fctx.fill();
    if (hold > 0) {                       // 比 ✌️ 时显示一个进度环
      fctx.strokeStyle = '#f5d38a'; fctx.lineWidth = 3;
      fctx.beginPath(); fctx.arc(p.x, p.y, 34, -Math.PI / 2, -Math.PI / 2 + hold * Math.PI * 2); fctx.stroke();
    }
  }
};

/* ============================================================
 * 3. 三种输入
 *    每种输入每帧返回同一种结构：{ p: 归一化坐标, pinch: 是否按下, open: 和弦, victory: 结束 }
 *    主流程不关心输入来自哪里 —— 手、鼠标、还是程序自己。
 * ============================================================ */

// 3.1 摄像头手势：MediaPipe 每帧给出手部 21 个关键点
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const HAND_LINKS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
                    [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const Hand = {
  video: $('#cam'), lm: null, lastVT: -1, last: { p: null }, pts: null,
  async start() {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' } });
    this.video.srcObject = stream; await this.video.play();
    const vision = await import(MP);
    const files = await vision.FilesetResolver.forVisionTasks(MP + '/wasm');
    const opts = d => ({ baseOptions: { delegate: d, modelAssetPath:
      'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task' },
      runningMode: 'VIDEO', numHands: 1 });
    try { this.lm = await vision.HandLandmarker.createFromOptions(files, opts('GPU')); }
    catch (e) { this.lm = await vision.HandLandmarker.createFromOptions(files, opts('CPU')); }
  },
  // 摄像头坐标 → 屏幕坐标：水平镜像，并放大 1.4 倍，手不用伸到画面边缘也能够到屏幕四角
  map: l => ({ x: clamp((0.5 - l.x) * 1.4 + 0.5, 0, 1), y: clamp((l.y - 0.5) * 1.4 + 0.5, 0, 1) }),
  read() {
    if (!this.lm || this.video.readyState < 2 || this.video.currentTime === this.lastVT) return this.last;
    this.lastVT = this.video.currentTime;
    const h = this.lm.detectForVideo(this.video, performance.now()).landmarks[0];
    if (!h) { this.pts = null; return this.last = { p: null }; }
    const d = (a, b) => Math.hypot(h[a].x - h[b].x, h[a].y - h[b].y);
    const size = d(0, 9);                                     // 手掌大小，用于消除远近的影响
    const ext = tip => d(0, tip) > d(0, tip - 2) * 1.15;      // 指尖比第二关节离手腕更远 = 手指伸直
    const [iE, mE, rE, pE] = [8, 12, 16, 20].map(ext);
    const pinchR = d(4, 8) / size;
    this.pts = h.map(this.map);
    return this.last = {
      p: this.pts[8],                                         // 食指指尖就是"画笔"
      pinch: pinchR < 0.35,                                   // 拇指与食指捏合 = 按下琴键
      open: iE && mE && rE && pE && pinchR > 0.6,             // 五指张开 = 和弦
      victory: iE && mE && !rE && !pE && pinchR > 0.5         // 比耶 ✌️ = 结束演奏
    };
  },
  drawSkeleton() {
    if (!this.pts) return;
    const P = this.pts.map(q => Painter.toScreen(q));
    fctx.strokeStyle = 'rgba(180,200,255,0.25)'; fctx.lineWidth = 1.5;
    for (const [a, b] of HAND_LINKS) { fctx.beginPath(); fctx.moveTo(P[a].x, P[a].y); fctx.lineTo(P[b].x, P[b].y); fctx.stroke(); }
    fctx.fillStyle = 'rgba(200,220,255,0.5)';
    for (const q of P) { fctx.beginPath(); fctx.arc(q.x, q.y, 2.5, 0, 7); fctx.fill(); }
  }
};

// 3.2 鼠标 / 触屏：按住拖动 = 弹奏；空格或右键 = 和弦；回车 = 完成
const Mouse = {
  p: null, down: false, tapped: false, chordFlag: false,
  read() {   // tapped 保证即使按下和松开发生在同一帧之内，这次点击也不会丢
    const o = { p: this.p, pinch: this.down || this.tapped, open: this.chordFlag, victory: false };
    this.chordFlag = this.tapped = false; return o;
  }
};
addEventListener('pointermove', e => Mouse.p = { x: e.clientX / innerWidth, y: e.clientY / innerHeight });
addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.target.tagName !== 'CANVAS') return;
  Mouse.p = { x: e.clientX / innerWidth, y: e.clientY / innerHeight }; Mouse.down = Mouse.tapped = true;
});
addEventListener('pointerup', () => Mouse.down = false);
addEventListener('contextmenu', e => { e.preventDefault(); Mouse.chordFlag = true; });
addEventListener('keydown', e => {
  if (S.mode !== 'play') return;
  document.activeElement.blur();                // 防止空格误触发页面上的按钮
  if (e.code === 'Space') { e.preventDefault(); Mouse.chordFlag = true; }
  if (e.code === 'Enter') finish();
});

// 3.3 自动演奏：程序自己"挥手"。轨迹是两组不同频率正弦叠加的利萨如曲线，节奏来自一个 16 拍的节奏型
const Auto = {
  t: 0, rhythm: [1,0,1,1, 0,1,1,0, 1,0,1,0, 1,1,1,0],
  read(dt) {
    const t = this.t += dt / 1000, beat = t / 0.3, b = Math.floor(beat);
    return {
      p: { x: 0.5 + 0.33 * Math.sin(t * 0.61) + 0.07 * Math.sin(t * 2.7),
           y: 0.5 + 0.3 * Math.sin(t * 0.83 + 0.6) + 0.07 * Math.cos(t * 2.1) },
      pinch: this.rhythm[b % 16] === 1 && beat - b < 0.5,
      open: b % 32 === 31 && beat - b < 0.3,
      victory: t > 28
    };
  }
};

/* ============================================================
 * 4. 录制与编码
 *    贺卡要能"重放"整场演奏，但不想依赖服务器 —— 于是把演奏压缩进网址本身。
 *    每个采样点只占 4 个字节：[距上一点的时间, x, y, 状态位]
 *    状态位：最高位 = 是否按下，次高位 = 抬手，低 5 位 = 事件（1~15 单音，16~30 和弦）
 *    数据过长时，保留所有发声的点，其余点隔一删一，直到能放进一个二维码。
 * ============================================================ */
const Rec = {
  s: [], lastT: 0, lastSample: 0, lastPressed: false,
  reset(now) { this.s = []; this.lastT = this.lastSample = now; },
  push(now, p, pressed, ev, lift) {
    if (!lift && !ev && pressed === this.lastPressed && now - this.lastSample < 100) return;
    this.s.push({ dt: now - this.lastT, x: p ? p.x : 0, y: p ? p.y : 0, pressed, ev, lift });
    this.lastT = this.lastSample = now; this.lastPressed = pressed;
  },
  encode() {
    let s = this.s;
    while (s.length * 4 > 800) {
      const out = []; let carry = 0;
      s.forEach((e, i) => {
        if (e.ev || e.lift || i % 2 === 0) { out.push({ ...e, dt: e.dt + carry }); carry = 0; } else carry += e.dt;
      });
      if (out.length === s.length) break;
      s = out;
    }
    const b = new Uint8Array(s.length * 4);
    s.forEach((e, i) => {
      b[i * 4] = Math.min(255, Math.round(e.dt / 20));
      b[i * 4 + 1] = Math.round(e.x * 255); b[i * 4 + 2] = Math.round(e.y * 255);
      b[i * 4 + 3] = (e.pressed ? 128 : 0) | (e.lift ? 64 : 0) | e.ev;
    });
    return btoa(String.fromCharCode(...b)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  },
  decode(str) {
    const bin = atob(str.replace(/-/g, '+').replace(/_/g, '/')), s = []; let t = 0;
    for (let i = 0; i + 3 < bin.length; i += 4) {
      const c = k => bin.charCodeAt(i + k), f = c(3);
      t += c(0) * 20;
      s.push({ t, p: { x: c(1) / 255, y: c(2) / 255 }, pressed: !!(f & 128), lift: !!(f & 64), ev: f & 31 });
    }
    return s;
  }
};

/* ============================================================
 * 5. 贺卡生成
 *    把画作铺满卡面，叠加渐变遮罩、祝福文字、演奏数据和二维码，导出为 1600×1000 的 JPG。
 * ============================================================ */
function renderCard(info) {
  const W = 1600, H = 1000, c = document.createElement('canvas'), g = c.getContext('2d');
  c.width = W; c.height = H;
  const v = Painter.view, sx = v.x * DPR, sy = v.y * DPR, sw = v.w * DPR, sh = v.h * DPR;
  const sc = Math.max(W / sw, H / sh), dw = sw * sc, dh = sh * sc;
  g.drawImage(bg, sx, sy, sw, sh, (W - dw) / 2, (H - dh) / 2, dw, dh);
  g.drawImage(art, sx, sy, sw, sh, (W - dw) / 2, (H - dh) / 2, dw, dh);

  const shade = g.createLinearGradient(0, H * 0.45, 0, H);
  shade.addColorStop(0, 'rgba(3,5,15,0)'); shade.addColorStop(1, 'rgba(3,5,15,0.88)');
  g.fillStyle = shade; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(245,211,138,0.6)'; g.lineWidth = 2; g.strokeRect(30, 30, W - 60, H - 60);
  g.strokeStyle = 'rgba(245,211,138,0.25)'; g.strokeRect(40, 40, W - 80, H - 80);

  const font = '"PingFang SC","Microsoft YaHei",sans-serif';
  g.fillStyle = 'rgba(232,236,255,0.7)'; g.font = `22px ${font}`;
  g.fillText('指 尖 交 响  ·  A SYMPHONY AT YOUR FINGERTIPS', 80, 95);
  g.fillStyle = '#f5d38a'; g.font = `bold 68px ${font}`; g.fillText(`致 ${info.to}`, 80, 690);
  g.fillStyle = '#e8ecff'; g.font = `36px ${font}`;
  wrapText(g, info.msg, 80, 760, 1000, 52);
  g.fillStyle = 'rgba(232,236,255,0.8)'; g.font = `28px ${font}`; g.fillText(`—— ${info.from}`, 80, 880);
  g.fillStyle = 'rgba(232,236,255,0.45)'; g.font = `20px ${font}`;
  g.fillText(`用指尖为你弹奏了 ${info.notes} 个音符 · 时长 ${info.secs} 秒 · 每一笔光，都是一个音`, 80, 925);

  const qr = makeQR(info.url);
  if (qr) {
    g.fillStyle = '#fff'; roundRect(g, W - 370, H - 440, 290, 330, 16); g.fill();
    g.imageSmoothingEnabled = false; g.drawImage(qr, W - 355, H - 425, 260, 260);
    g.fillStyle = '#1a2250'; g.font = `22px ${font}`; g.textAlign = 'center'; g.fillText('扫码聆听这首曲子', W - 225, H - 135);
  }
  return c;
}
function wrapText(g, text, x, y, maxW, lh) {
  let line = '';
  for (const ch of text) {
    if (g.measureText(line + ch).width > maxW) { g.fillText(line, x, y); line = ch; y += lh; } else line += ch;
  }
  g.fillText(line, x, y);
}
function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function makeQR(url) {
  try {
    const q = qrcode(0, 'L'); q.addData(url); q.make();
    const n = q.getModuleCount(), c = document.createElement('canvas'), g = c.getContext('2d');
    const margin = 4;
    c.width = c.height = n + margin * 2;
    g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.fillStyle = '#000';
    for (let r = 0; r < n; r++) for (let col = 0; col < n; col++) if (q.isDark(r, col)) g.fillRect(col + margin, r + margin, 1, 1);
    return c;
  } catch (e) { return null; }
}
function showCard(info) {
  // 贺卡统一使用公开分享站点，避免从本地文件或旧托管地址生成不可访问的二维码。
  info = { ...info, url: 'https://edwardyu1596-maker.github.io/fingertip-symphony/' + new URL(info.url, location.href).hash };
  const c = renderCard(info);
  $('#cardImg').src = c.toDataURL('image/jpeg', 0.92);
  $('#saveBtn').onclick = () => { const a = document.createElement('a'); a.href = $('#cardImg').src; a.download = `指尖交响_致${info.to}.jpg`; a.click(); };
  $('#copyBtn').onclick = () => navigator.clipboard.writeText(info.url).then(() => toast('链接已复制，发给 TA 吧'));
  $('#linkNote').textContent = '将贺卡发给朋友，微信长按识别二维码，打开后轻触“打开并播放”即可聆听。';
  $('#form').hidden = true; $('#hud').hidden = true; $('#card').hidden = false;
}

/* ============================================================
 * 6. 主流程
 *    idle（封面）→ play（演奏）→ done（填写祝福）→ 贺卡
 *    或者从带数据的链接进入：信封 → replay（回放）→ 贺卡
 * ============================================================ */
const TIPS = {
  hand: '捏合拇指与食指：弹奏　·　张开手掌：和弦　·　比 ✌️ 保持一秒：完成',
  mouse: '按住拖动：弹奏　·　空格 / 右键：和弦　·　回车：完成',
  auto: '自动演奏中……程序正在用正弦曲线"挥手"'
};

async function begin(kind) {
  Audio.init(); await Audio.ctx.resume();
  if (kind === 'hand') {
    $('#loading').textContent = '正在打开摄像头并加载手势模型……';
    try { await Hand.start(); $('#cam').classList.add('on'); }
    catch (e) { console.error(e); toast('摄像头或模型加载失败，已切换为鼠标模式'); kind = 'mouse'; }
  }
  S.src = { hand: Hand, mouse: Mouse, auto: Auto }[kind];
  Auto.t = 0;
  $('#tip').textContent = TIPS[kind];
  $('#start').hidden = true; $('#hud').hidden = false;
  actx.clearRect(0, 0, innerWidth, innerHeight);
  fitView(innerWidth / innerHeight);
  Object.assign(S, { mode: 'play', t0: performance.now(), notes: 0, smooth: null, lifted: true, vT: 0 });
  Rec.reset(performance.now());
}

// 把一个事件同时变成声音和画面 —— 现场演奏与回放共用这一个函数，保证两者完全一致
function apply(p, pressed, ev) {
  const step = stepOf(p.y), pan = (p.x - 0.5) * 1.4;
  Painter.stroke(p, step, pressed);
  if (ev >= 16) { Audio.chord(ev - 16, pan); Painter.burst(p, ev - 16); }
  else if (ev > 0) { Audio.note(ev - 1, 1, pan); Painter.bloom(p, ev - 1); }
  return step;
}

function handleInput(inp, now) {
  if (S.src === Hand) Hand.drawSkeleton();
  if (!inp || !inp.p) {                                   // 手离开画面：抬笔
    if (!S.lifted) { Rec.push(now, null, false, 0, true); Painter.lift(); S.lifted = true; }
    S.prevPinch = false; S.smooth = null; Painter.drawGuide(-1); return;
  }
  S.lifted = false;
  const a = S.src === Hand ? 0.5 : 1;                      // 对摄像头数据做平滑，消除抖动
  S.smooth = S.smooth ? { x: S.smooth.x + (inp.p.x - S.smooth.x) * a, y: S.smooth.y + (inp.p.y - S.smooth.y) * a } : { ...inp.p };
  const p = S.smooth, step = stepOf(p.y);

  // 触发规则：刚捏合时发声；保持捏合并滑到新的音高时再次发声（像在琴弦上划过）
  let ev = 0;
  if (inp.pinch && (!S.prevPinch || (step !== S.lastStep && now - S.lastNoteT > 90))) ev = step + 1;
  if (inp.open && !S.prevOpen) ev = 16 + step;
  if (ev) { S.lastNoteT = now; S.lastStep = step; S.notes++; }
  apply(p, inp.pinch, ev);
  Rec.push(now, p, inp.pinch, ev, false);
  S.prevPinch = inp.pinch; S.prevOpen = inp.open;

  if (inp.victory) { S.vT = S.vT || now; if (now - S.vT > 900) return finish(); } else S.vT = 0;
  Painter.drawGuide(step);
  Painter.drawCursor(p, step, inp.pinch, S.vT ? (now - S.vT) / 900 : 0);
}

function finish() {
  if (S.mode !== 'play') return;
  S.mode = 'done'; Painter.lift();
  [0, 2, 4, 7, 10].forEach((n, j) => Audio.note(n, 0.8, 0, j * 0.12));   // 结尾的上行琶音
  S.secs = Math.round((performance.now() - S.t0) / 1000);
  $('#formStat').textContent = `你弹奏了 ${S.notes} 个音符，用时 ${S.secs} 秒。写下想对 TA 说的话：`;
  $('#hud').hidden = true; $('#form').hidden = false;
}

$('#makeCard').onclick = () => {
  const to = $('#fTo').value.trim() || '你', msg = $('#fMsg').value.trim() || '祝你快乐', from = $('#fFrom').value.trim() || '我';
  const data = ['v1', Math.round(Painter.view.w / Painter.view.h * 100), Rec.encode(),
                encodeURIComponent(to), encodeURIComponent(msg), encodeURIComponent(from)].join(',');
  showCard({ to, msg, from, notes: S.notes, secs: S.secs, url: location.href.split('#')[0] + '#' + data });
};

// 从链接打开：解析网址中的演奏数据，先显示信封，点击后（浏览器要求用户点击才能发声）开始回放
function tryReplay() {
  const parts = location.hash.slice(1).split(',');
  if (parts[0] !== 'v1' || parts.length < 6) return false;
  let samples;
  try { samples = Rec.decode(parts[2]); } catch (e) { return false; }
  const [to, msg, from] = parts.slice(3, 6).map(decodeURIComponent);
  S.aspect = (+parts[1] || 178) / 100;
  $('#start').hidden = true; $('#env').hidden = false;
  $('#envTitle').textContent = `致 ${to}`;
  $('#envDesc').textContent = `${from} 用指尖为你弹奏了一首曲子，并把它画了下来。`;
  $('#openBtn').onclick = () => openSharedSong(async () => {
    Audio.init(); await unlockAudio(Audio.ctx);
    $('#env').hidden = true; S.mode = 'replay'; fitView(S.aspect);
    const t0 = performance.now(), end = samples.length ? samples[samples.length - 1].t : 0;
    let idx = 0;
    S.replay = now => {
      const rt = now - t0;
      while (idx < samples.length && samples[idx].t <= rt) {
        const s = samples[idx++];
        if (s.lift) Painter.lift(); else apply(s.p, s.pressed, s.ev);
        S.cur = s;
      }
      if (S.cur && !S.cur.lift) Painter.drawCursor(S.cur.p, stepOf(S.cur.p.y), S.cur.pressed, 0);
      if (rt > end + 2500) {
        S.mode = 'done';
        showCard({ to, msg, from, notes: samples.filter(s => s.ev).length, secs: Math.round(end / 1000), url: location.href });
        document.querySelectorAll('.again').forEach(b => b.textContent = '我也来弹一首');
      }
    };
  });
  return true;
}

document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => begin(b.dataset.mode));
document.querySelectorAll('.again').forEach(b => b.onclick = () => { history.replaceState(null, '', location.href.split('#')[0]); location.reload(); });
$('#doneBtn').onclick = finish;

let lastFrame = performance.now();
function frame(now) {
  const dt = Math.min(50, now - lastFrame); lastFrame = now;
  fctx.clearRect(0, 0, innerWidth, innerHeight);
  if (S.mode === 'play') {
    handleInput(S.src.read(dt), now);
    $('#stat').textContent = `♪ ${S.notes}　${Math.floor((now - S.t0) / 1000)}s`;
  } else if (S.mode === 'replay') S.replay(now);
  Painter.updateFx();
  requestAnimationFrame(frame);
}

addEventListener('resize', resize);
resize();
tryReplay();
requestAnimationFrame(frame);
</script>
<script src="huasha.js"></script>
