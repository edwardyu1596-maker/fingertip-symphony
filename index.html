<!DOCTYPE html>
<!--
  《指尖交响》
  以手为弦，以光为墨。

  在空中抬起手弹一支曲子，指尖走过的地方留下光；
  曲终时，音乐与画合成一封可以扫码重听的信笺。

  运行：无需编译，用 Chrome / Edge 打开本文件即可（需联网）。
  技术：HTML + Canvas 2D + Web Audio API；手势识别使用 Google MediaPipe Hand Landmarker。

  同目录文件：
    huasha.js / special-person-score.js / special-person.js —— 两首简谱曲目《画沙》《特别的人》的乐谱与演奏
    audio/special-person.m4a —— 《特别的人》预先合成的器乐音频（手机上无需现场合成）
    vendor/qrcode.min.js —— 二维码生成库
    hand_landmarker.task —— 手势识别模型

  代码结构：
    0. 全局状态与画布
    1. 音乐引擎 —— 用 Web Audio 从零合成音色，不使用任何音频文件
    2. 绘画引擎 —— 每个音开一朵梅花，每个和弦漾开一圈涟漪
    3. 三种输入 —— 摄像头手势 / 鼠标 / 自动演奏
    4. 录制与编码 —— 把整支曲子压缩进一条网址
    5. 信笺生成 —— 画 + 寄语 + 二维码
    6. 主流程
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>指尖交响</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 字体异步加载：国内网络打不开时不阻塞页面，直接退回系统宋体 -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script src="vendor/qrcode.min.js"></script>
<style>
  :root {
    --ink: #0b0e17; --paper: #ece4d3; --dim: rgba(236,228,211,.55); --faint: rgba(236,228,211,.32);
    --gold: #d6b676; --seal: #b23a2e;
    --serif: "Noto Serif SC", "Songti SC", "STSong", "Source Han Serif SC", "SimSun", serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--ink); color: var(--paper);
    font-family: var(--serif); user-select: none; -webkit-font-smoothing: antialiased; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #fx { pointer-events: none; }
  #cam { position: fixed; right: 24px; bottom: 24px; width: 168px; transform: scaleX(-1); filter: grayscale(1) contrast(1.1);
    opacity: 0; transition: opacity .8s; pointer-events: none; z-index: 4; border: 1px solid var(--faint); }
  #cam.on { opacity: .28; }

  .panel { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 22px; padding: 24px; text-align: center; background: rgba(8,10,18,.84); }
  .panel.soft { background: rgba(8,10,18,.62); backdrop-filter: blur(3px); }
  .panel[hidden], #hud[hidden] { display: none; }

  .title { position: relative; }
  h1 { font-size: clamp(40px, 7vw, 76px); font-weight: 400; letter-spacing: .42em; padding-left: .42em; line-height: 1.2; }
  h2 { font-size: clamp(28px, 4vw, 40px); font-weight: 400; letter-spacing: .3em; padding-left: .3em; }
  .seal { display: inline-grid; place-items: center; width: 30px; height: 30px; background: var(--seal); color: #f3e9d8;
    font-size: 16px; font-style: normal; border-radius: 2px; box-shadow: inset 0 0 0 2px rgba(243,233,216,.22); }
  .title .seal { position: absolute; right: -34px; top: 2px; }
  .seal.sm { width: 18px; height: 18px; font-size: 10px; box-shadow: inset 0 0 0 1px rgba(243,233,216,.25); }
  .motto, .fhead { color: var(--gold); font-size: 15px; font-weight: 400; letter-spacing: .6em; padding-left: .6em; }
  .songs { display: flex; gap: 28px; align-items: baseline; color: var(--faint); font-size: 13px; letter-spacing: .2em; }
  .songs button { font-size: 14px; }
  .rule { width: 44px; height: 1px; background: var(--gold); opacity: .6; }
  .desc { color: var(--dim); font-size: 15px; line-height: 2.2; letter-spacing: .08em; }
  .note { color: rgba(236,228,211,.36); font-size: 12px; letter-spacing: .2em; }
  .links { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }

  button { font: inherit; font-size: 16px; letter-spacing: .25em; padding: 6px 0 6px .25em; color: var(--paper);
    background: none; border: none; border-bottom: 1px solid var(--faint); border-radius: 0; cursor: pointer; transition: color .3s, border-color .3s; }
  button:hover, button:focus-visible { color: var(--gold); border-color: var(--gold); outline: none; }
  button.main { color: var(--gold); border-color: var(--gold); }

  label { display: flex; gap: 18px; align-items: baseline; width: min(420px, 88vw); }
  label span { width: 3em; flex: none; text-align: left; color: var(--gold); font-size: 14px; letter-spacing: .3em; }
  input { flex: 1; font: inherit; font-size: 17px; letter-spacing: .05em; color: var(--paper); background: none;
    border: none; border-bottom: 1px solid var(--faint); padding: 8px 2px; outline: none; transition: border-color .3s; }
  input:focus { border-color: var(--gold); }

  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #hud .top { position: absolute; top: 22px; left: 28px; right: 28px; display: flex; justify-content: space-between; align-items: center; }
  #hud .brand { display: flex; gap: 12px; align-items: center; color: var(--dim); font-size: 14px; letter-spacing: .45em; }
  #hud .right { display: flex; gap: 28px; align-items: center; color: var(--dim); font-size: 13px; letter-spacing: .15em; font-variant-numeric: tabular-nums; }
  #hud button { pointer-events: auto; font-size: 14px; }
  #hud .tip { position: absolute; bottom: 26px; left: 0; right: 0; color: var(--faint); font-size: 13px; letter-spacing: .2em; white-space: pre; text-align: center; }

  #cardImg { max-width: min(92vw, 1120px); max-height: 70vh; box-shadow: 0 30px 90px rgba(0,0,0,.65); }
  #toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 20; padding: 10px 22px;
    background: rgba(18,21,32,.94); border: 1px solid rgba(214,182,118,.35); font-size: 14px; letter-spacing: .1em;
    opacity: 0; transition: opacity .4s; pointer-events: none; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="art"></canvas>
<canvas id="fx"></canvas>
<video id="cam" playsinline muted></video>

<div id="hud" hidden>
  <div class="top">
    <span class="brand"><i class="seal sm">奏</i>指尖交响</span>
    <span class="right"><span id="stat"></span><button id="songPause" hidden>暂停</button><button id="songPaintAll" hidden>画完整幅</button><button id="songDownload" hidden>保存音频</button><button id="doneBtn">曲终 →</button></span>
  </div>
  <div class="tip" id="tip"></div>
</div>

<div id="start" class="panel">
  <div class="title"><h1>指尖交响</h1><i class="seal">奏</i></div>
  <div class="motto">以手为弦 · 以光为墨</div>
  <div class="rule"></div>
  <p class="desc">在空中抬起手，为一个人弹一支曲子。<br>指尖走过的地方会留下光，曲终时，它就是一封信。</p>
  <div class="links">
    <button class="main" data-mode="hand">以手弹奏</button>
    <button data-mode="mouse">以鼠标弹奏</button>
    <button data-mode="auto">听它自己弹</button>
  </div>
  <div class="songs">或者听一首<button id="huashaBtn">《画沙》</button><button id="specialPersonBtn">《特别的人》</button></div>
  <p class="note" id="loading">宜戴耳机 · 以手弹奏需开启摄像头</p>
</div>

<div id="form" class="panel soft" hidden>
  <h2 class="fhead">曲终</h2>
  <p class="desc" id="formStat"></p>
  <label><span>致</span><input id="fTo" maxlength="10" value="你"></label>
  <label><span>寄语</span><input id="fMsg" maxlength="36" value="愿你往后的日子，都有好听的声音。"></label>
  <label><span>落款</span><input id="fFrom" maxlength="10" value="一个写代码的人"></label>
  <div class="links"><button class="main" id="makeCard">封笺</button><button class="again">重弹</button></div>
</div>

<div id="card" class="panel soft" hidden>
  <img id="cardImg" alt="信笺">
  <div class="links btns">
    <button class="main" id="saveBtn">存为图片</button>
    <button id="copyBtn">复制链接</button>
    <button class="again">再弹一首</button>
  </div>
  <p class="note" id="linkNote"></p>
</div>

<div id="env" class="panel" hidden>
  <div class="motto">有一封信</div>
  <h2 id="envTitle"></h2>
  <div class="rule"></div>
  <p class="desc" id="envDesc"></p>
  <div class="links"><button class="main" id="openBtn">拆开</button></div>
  <p class="note" id="playHint">拆开后会有声音，请打开音量</p>
</div>

<div id="toast"></div>

<script>
/* ============================================================
 * 0. 全局状态与画布
 *    三层画布：bg 背景 / art 永久保留的画 / fx 每帧重绘的特效（光标、涟漪、微尘）
 * ============================================================ */
const $ = s => document.querySelector(s);
const bg = $('#bg'), art = $('#art'), fx = $('#fx');
const bctx = bg.getContext('2d'), actx = art.getContext('2d'), fctx = fx.getContext('2d');
const DPR = Math.min(devicePixelRatio || 1, 2);
const SERIF = '"Noto Serif SC","Songti SC","STSong","Source Han Serif SC","SimSun",serif';
const S = { mode: 'idle', src: null, smooth: null, prevPinch: false, prevOpen: false, lastStep: -1,
            lastNoteT: 0, vT: 0, t0: 0, notes: 0, lifted: true, aspect: 16 / 9 };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const stepOf = y => clamp(Math.floor((1 - y) * 15), 0, 14);   // 纵坐标 → 音阶序号（越高音越高）

// 数字写成汉字：86 → 八十六
const CN = '零一二三四五六七八九';
function cnNum(n) {
  n = clamp(Math.round(n), 0, 999);
  if (n < 10) return CN[n];
  if (n < 100) return (n < 20 ? '' : CN[Math.floor(n / 10)]) + '十' + (n % 10 ? CN[n % 10] : '');
  const r = n % 100;
  return CN[Math.floor(n / 100)] + '百' + (r === 0 ? '' : r < 10 ? '零' + CN[r] : (r < 20 ? '一' : '') + cnNum(r));
}

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.opacity = 1; setTimeout(() => t.style.opacity = 0, 2600); }

// 在点击处理器内立即恢复音频，并发出静音采样，兼容手机 WebView（如微信）的音频启动限制。
async function unlockAudio(context) {
  const resumed = context.resume();
  const silent = context.createBufferSource();
  silent.buffer = context.createBuffer(1, 1, context.sampleRate);
  silent.connect(context.destination);
  silent.onended = () => silent.disconnect();
  silent.start(0);
  let timer;
  try {
    await Promise.race([resumed, new Promise((_, reject) => {
      timer = setTimeout(() => reject(new Error('音频尚未启动，请再次轻触')), 5000);
    })]);
    if (context.state !== 'running') throw new Error('音频尚未启动，请再次轻触');
  } finally { clearTimeout(timer); }
}

// 拆开信封：启动失败时留在信封页，提示再点一次
async function openSharedSong(play) {
  const button = $('#openBtn');
  if (button.disabled) return;
  button.disabled = true; button.textContent = '正在准备……';
  try { await play(); }
  catch (e) {
    console.error(e);
    $('#env').hidden = false;
    $('#playHint').textContent = '声音没有响起来。请检查音量后再点一次；仍然没有声音的话，可在右上角选择用浏览器打开。';
    toast('请再点一次拆开');
  } finally {
    button.disabled = false; button.textContent = '拆开';
  }
}

function resize() {
  const keep = document.createElement('canvas');       // 改变窗口大小时保留已画的内容
  keep.width = art.width; keep.height = art.height;
  if (art.width && art.height) keep.getContext('2d').drawImage(art, 0, 0);
  for (const c of [bg, art, fx]) {
    c.width = innerWidth * DPR; c.height = innerHeight * DPR;
    c.getContext('2d').setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  if (keep.width && keep.height) actx.drawImage(keep, 0, 0, keep.width / DPR, keep.height / DPR);
  fitView(S.mode === 'replay' ? S.aspect : innerWidth / innerHeight);
  drawBackground();
}

// 画的区域：现场演奏时为全屏；回放时按原始长宽比居中适配（手机竖屏也不变形）
function fitView(a) {
  const W = innerWidth, H = innerHeight;
  Painter.view = W / H > a ? { w: H * a, h: H, x: (W - H * a) / 2, y: 0 }
                           : { w: W, h: W / a, x: 0, y: (H - W / a) / 2 };
}

// 背景：墨色底 + 一点纸纹颗粒 + 疏星 + 四周暗角
function drawBackground() {
  const W = innerWidth, H = innerHeight, R = Math.max(W, H);
  bctx.fillStyle = '#0b0e17'; bctx.fillRect(0, 0, W, H);
  let g = bctx.createRadialGradient(W / 2, H * 0.42, 0, W / 2, H * 0.42, R * 0.7);
  g.addColorStop(0, 'rgba(40,48,80,0.5)'); g.addColorStop(1, 'rgba(40,48,80,0)');
  bctx.fillStyle = g; bctx.fillRect(0, 0, W, H);
  for (let i = 0, n = W * H / 90; i < n; i++) {
    bctx.fillStyle = `rgba(236,228,211,${Math.random() * 0.035})`;
    bctx.fillRect(Math.random() * W, Math.random() * H, 1, 1);
  }
  for (let i = 0; i < 70; i++) {
    bctx.fillStyle = `rgba(236,228,211,${0.1 + Math.random() * 0.4})`;
    bctx.beginPath(); bctx.arc(Math.random() * W, Math.random() * H, Math.random() * 0.9, 0, 7); bctx.fill();
  }
  g = bctx.createRadialGradient(W / 2, H / 2, R * 0.35, W / 2, H / 2, R * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.5)');
  bctx.fillStyle = g; bctx.fillRect(0, 0, W, H);
}

/* ============================================================
 * 1. 音乐引擎
 *    - 音阶：五声音阶「宫 商 角 徵 羽」（即 Do Re Mi Sol La），共三个八度十五个音。
 *      五声音阶里没有半音，任意组合都和谐 —— 不会乐器的人也能弹得好听。
 *    - 音色：三角波 + 两个泛音正弦波，快起慢落，接近钢片琴 / 拇指琴。
 *    - 空间感：用"指数衰减的白噪声"现场生成混响，再加一路回声；
 *      手在左边，声音就从左边来。
 * ============================================================ */
const Audio = {
  ctx: null,
  init() {
    if (this.ctx) return;
    const ctx = this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor(); comp.connect(ctx.destination);
    this.out = ctx.createGain(); this.out.gain.value = 0.8; this.out.connect(comp);

    const len = ctx.sampleRate * 3, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    }
    this.rev = ctx.createConvolver(); this.rev.buffer = ir;
    const wet = ctx.createGain(); wet.gain.value = 0.45; this.rev.connect(wet); wet.connect(comp);

    this.delay = ctx.createDelay(); this.delay.delayTime.value = 0.36;
    const fb = ctx.createGain(); fb.gain.value = 0.28;
    this.delay.connect(fb); fb.connect(this.delay); this.delay.connect(this.rev);
    this.drone();
  },
  freq(i) { const st = [0, 2, 4, 7, 9]; return 261.63 * Math.pow(2, (Math.floor(i / 5) * 12 + st[i % 5]) / 12); },

  // 弹一个音：i 为音阶序号，pan 为左右声道（-1 ~ 1），when 为延迟秒数
  note(i, vel = 1, pan = 0, when = 0) {
    const ctx = this.ctx, t = ctx.currentTime + when, f = this.freq(i);
    const env = ctx.createGain();
    env.gain.setValueAtTime(0.0001, t);
    env.gain.exponentialRampToValueAtTime(0.22 * vel, t + 0.008);
    env.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);
    const p = ctx.createStereoPanner(); p.pan.value = clamp(pan, -1, 1);
    env.connect(p); p.connect(this.out); p.connect(this.rev); p.connect(this.delay);
    for (const [mul, type, amp] of [[1, 'triangle', 1], [2, 'sine', 0.35], [3.01, 'sine', 0.1]]) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = f * mul; g.gain.value = amp;
      o.connect(g); g.connect(env); o.start(t); o.stop(t + 2.5);
    }
  },
  // 和弦：以当前音为根，在五声音阶里隔一取一堆叠，略微错开成琶音，再垫一个低音
  chord(i, pan = 0) {
    const root = Math.max(0, i - 2);
    [0, 2, 4, 7].forEach((k, j) => { if (root + k < 15) this.note(root + k, 0.7, pan, j * 0.06); });
    const ctx = this.ctx, t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = this.freq(root % 5) / 2;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 3);
    o.connect(g); g.connect(this.out); g.connect(this.rev); o.start(t); o.stop(t + 3.1);
  },
  // 底下一层很轻的持续音：三个低频锯齿波过低通滤波器，滤波频率被极慢的振荡推动，像在呼吸
  drone() {
    const ctx = this.ctx, g = ctx.createGain(), lp = ctx.createBiquadFilter();
    g.gain.setValueAtTime(0, ctx.currentTime); g.gain.linearRampToValueAtTime(0.03, ctx.currentTime + 4);
    lp.type = 'lowpass'; lp.frequency.value = 500; lp.connect(g); g.connect(this.out); g.connect(this.rev);
    for (const f of [65.41, 98, 130.81]) {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = Math.random() * 12 - 6;
      o.connect(lp); o.start();
    }
    const lfo = ctx.createOscillator(), lg = ctx.createGain();
    lfo.frequency.value = 0.07; lg.gain.value = 300; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  }
};

/* ============================================================
 * 2. 绘画引擎
 *    - 五声各配一种中国传统色：宫·缃黄  商·月白  角·天青  徵·朱砂  羽·黛蓝
 *      同一个音，八度越高颜色越亮。
 *    - 轨迹：用"中点二次贝塞尔曲线"连接采样点，线条才圆润；
 *      按下时是三层叠加的光，松开时只是一根细丝，像琴弦。
 *    - 每弹一个音，开一朵五瓣梅花（五声对五瓣）；每个和弦，漾开一圈涟漪。
 * ============================================================ */
const TONES = [
  { name: '宫', h: 40, s: 72 }, { name: '商', h: 205, s: 28 }, { name: '角', h: 172, s: 42 },
  { name: '徵', h: 6, s: 70 },  { name: '羽', h: 222, s: 62 }
];
const Painter = {
  view: { x: 0, y: 0, w: 1, h: 1 }, pts: [], parts: [], rings: [],
  color(i, a, dl = 0) {
    const t = TONES[i % 5], l = Math.min(94, 60 + Math.floor(i / 5) * 9 + dl);
    return `hsla(${t.h},${t.s}%,${l}%,${a})`;
  },
  k() { return Math.min(this.view.w, this.view.h) / 800; },          // 尺寸随屏幕缩放
  toScreen(p) { return { x: this.view.x + p.x * this.view.w, y: this.view.y + p.y * this.view.h }; },
  lift() { this.pts = []; },

  stroke(np, step, pressed) {
    const p = this.toScreen(np), pts = this.pts;
    if (pts.length && Math.hypot(p.x - pts[pts.length - 1].x, p.y - pts[pts.length - 1].y) < 0.8) return;
    pts.push(p); if (pts.length > 3) pts.shift();
    if (pts.length < 3) return;
    const [a, b, c] = pts, k = this.k();
    const m1 = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, m2 = { x: (b.x + c.x) / 2, y: (b.y + c.y) / 2 };
    const thin = clamp(1.3 - Math.hypot(c.x - b.x, c.y - b.y) / 90, 0.5, 1.3);   // 越快越细，像行笔
    const layers = pressed ? [[11, 0.045, 0], [3.5, 0.16, 5], [1.1, 0.85, 18]] : [[0.9, 0.16, 12]];
    actx.save(); actx.globalCompositeOperation = 'lighter'; actx.lineCap = 'round';
    for (const [w, al, dl] of layers) {
      actx.strokeStyle = this.color(step, al, dl);
      actx.lineWidth = w * k * (pressed ? thin : 1);
      actx.beginPath(); actx.moveTo(m1.x, m1.y); actx.quadraticCurveTo(b.x, b.y, m2.x, m2.y); actx.stroke();
    }
    actx.restore();
  },

  // 梅花：五片圆瓣 + 一簇花蕊；音越高，花越大
  bloom(np, i) {
    const p = this.toScreen(np), k = this.k(), r = (15 + (i % 5) * 1.8 + Math.floor(i / 5) * 3.5) * k;
    actx.save(); actx.globalCompositeOperation = 'lighter'; actx.translate(p.x, p.y); actx.rotate(Math.random() * 7);
    actx.lineWidth = 0.8 * k;
    for (let j = 0; j < 5; j++) {
      const a = j / 5 * Math.PI * 2, cx = Math.cos(a) * r * 0.55, cy = Math.sin(a) * r * 0.55;
      actx.fillStyle = this.color(i, 0.09); actx.strokeStyle = this.color(i, 0.4, 12);
      actx.beginPath(); actx.arc(cx, cy, r * 0.45, 0, 7); actx.fill(); actx.stroke();
    }
    actx.strokeStyle = 'hsla(42,70%,80%,0.55)'; actx.fillStyle = 'hsla(42,80%,85%,0.85)';
    for (let j = 0; j < 7; j++) {
      const a = j / 7 * Math.PI * 2 + 0.3, len = r * (0.28 + 0.08 * (j % 2));
      actx.beginPath(); actx.moveTo(0, 0); actx.lineTo(Math.cos(a) * len, Math.sin(a) * len); actx.stroke();
      actx.beginPath(); actx.arc(Math.cos(a) * len, Math.sin(a) * len, 1.1 * k, 0, 7); actx.fill();
    }
    actx.restore();
    this.scatter(p, i, 8); this.rings.push({ ...p, i, r: r * 0.5, max: r * 2.6 });
  },

  // 涟漪：几圈略带起伏的同心圆，像石子落进水里
  burst(np, i) {
    const p = this.toScreen(np), k = this.k(), R = (70 + i * 3) * k, seed = Math.random() * 7;
    actx.save(); actx.globalCompositeOperation = 'lighter'; actx.translate(p.x, p.y);
    for (let n = 1; n <= 5; n++) {
      const rr = R * n / 5;
      actx.strokeStyle = this.color(i, 0.32 - n * 0.045, 10); actx.lineWidth = (n === 1 ? 1.4 : 0.8) * k;
      actx.beginPath();
      for (let s = 0; s <= 96; s++) {
        const a = s / 96 * Math.PI * 2, wob = 1 + 0.025 * Math.sin(a * 6 + seed + n);
        s ? actx.lineTo(Math.cos(a) * rr * wob, Math.sin(a) * rr * wob) : actx.moveTo(rr * wob, 0);
      }
      actx.stroke();
    }
    actx.restore();
    this.scatter(p, i, 36); this.rings.push({ ...p, i, r: R * 0.2, max: R * 1.8 });
  },

  scatter(p, i, n) {                     // 微尘：慢慢向上飘散
    for (let j = 0; j < n; j++) {
      const a = Math.random() * 7, v = Math.random() * 1.6 + 0.2;
      this.parts.push({ x: p.x, y: p.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, i, life: 1 });
    }
  },

  updateFx() {
    fctx.save(); fctx.globalCompositeOperation = 'lighter';
    this.rings = this.rings.filter(r => {
      r.r += (r.max - r.r) * 0.05;
      const al = 1 - r.r / r.max;
      fctx.strokeStyle = this.color(r.i, al * 0.6, 15); fctx.lineWidth = 1;
      fctx.beginPath(); fctx.arc(r.x, r.y, r.r, 0, 7); fctx.stroke();
      return al > 0.03;
    });
    this.parts = this.parts.filter(q => {
      q.x += q.vx; q.y += q.vy; q.vx *= 0.95; q.vy = q.vy * 0.95 - 0.012; q.life -= 0.009;
      fctx.fillStyle = this.color(q.i, q.life * 0.9, 20);
      fctx.beginPath(); fctx.arc(q.x, q.y, 1.2 * q.life + 0.3, 0, 7); fctx.fill();
      return q.life > 0;
    });
    fctx.restore();
  },

  // 左侧的音阶刻度：宫商角徵羽，右边的小点表示第几个八度
  drawGuide(cur) {
    const v = this.view;
    fctx.font = `13px ${SERIF}`; fctx.textBaseline = 'middle'; fctx.textAlign = 'center';
    for (let i = 0; i < 15; i++) {
      const y = v.y + (1 - (i + 0.5) / 15) * v.h, on = i === cur;
      fctx.fillStyle = on ? this.color(i, 0.95, 12) : 'rgba(236,228,211,0.2)';
      fctx.fillText(TONES[i % 5].name, v.x + 24, y);
      for (let d = 0; d <= Math.floor(i / 5); d++) { fctx.beginPath(); fctx.arc(v.x + 38 + d * 4, y, 1, 0, 7); fctx.fill(); }
      if (on) { fctx.fillStyle = this.color(i, 0.16); fctx.fillRect(v.x + 56, y - 0.5, v.w - 112, 1); }
    }
  },

  // 光标：一个细圈加一个点；按下时圈收紧
  drawCursor(np, step, pressed, hold) {
    const p = this.toScreen(np), r = pressed ? 9 : 14;
    const g = fctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 30);
    g.addColorStop(0, this.color(step, pressed ? 0.35 : 0.18, 15)); g.addColorStop(1, this.color(step, 0));
    fctx.fillStyle = g; fctx.beginPath(); fctx.arc(p.x, p.y, 30, 0, 7); fctx.fill();
    fctx.strokeStyle = this.color(step, 0.9, 18); fctx.lineWidth = 1;
    fctx.beginPath(); fctx.arc(p.x, p.y, r, 0, 7); fctx.stroke();
    fctx.fillStyle = this.color(step, 1, 25);
    fctx.beginPath(); fctx.arc(p.x, p.y, pressed ? 3.2 : 1.8, 0, 7); fctx.fill();
    if (hold > 0) {                       // 比「耶」时，外圈一点点走满
      fctx.strokeStyle = '#d6b676'; fctx.lineWidth = 1.5;
      fctx.beginPath(); fctx.arc(p.x, p.y, 24, -Math.PI / 2, -Math.PI / 2 + hold * Math.PI * 2); fctx.stroke();
    }
  }
};

/* ============================================================
 * 3. 三种输入
 *    每种输入每帧返回同一种结构：{ p: 归一化坐标, pinch: 是否按下, open: 和弦, victory: 曲终 }
 *    主流程不关心输入来自哪里 —— 手、鼠标、还是程序自己。
 * ============================================================ */

// 3.1 摄像头手势：MediaPipe 每帧给出手部 21 个关键点
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODELS = ['hand_landmarker.task',      // 优先用同目录下的模型文件（国内网络更稳）
  'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'];
const HAND_LINKS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
                    [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const Hand = {
  video: $('#cam'), lm: null, lastVT: -1, last: { p: null }, pts: null,
  async start() {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' } });
    this.video.srcObject = stream; await this.video.play();
    const vision = await import(MP);
    const files = await vision.FilesetResolver.forVisionTasks(MP + '/wasm');
    for (const model of MODELS) for (const delegate of ['GPU', 'CPU']) {
      try {
        this.lm = await vision.HandLandmarker.createFromOptions(files,
          { baseOptions: { modelAssetPath: model, delegate }, runningMode: 'VIDEO', numHands: 1 });
        return;
      } catch (e) { console.warn(model, delegate, e); }
    }
    throw new Error('手势模型加载失败');
  },
  // 摄像头坐标 → 屏幕坐标：水平镜像，并放大 1.4 倍，手不用伸到画面边缘也能够到四角
  map: l => ({ x: clamp((0.5 - l.x) * 1.4 + 0.5, 0, 1), y: clamp((l.y - 0.5) * 1.4 + 0.5, 0, 1) }),
  read() {
    if (!this.lm || this.video.readyState < 2 || this.video.currentTime === this.lastVT) return this.last;
    this.lastVT = this.video.currentTime;
    const h = this.lm.detectForVideo(this.video, performance.now()).landmarks[0];
    if (!h) { this.pts = null; return this.last = { p: null }; }
    const d = (a, b) => Math.hypot(h[a].x - h[b].x, h[a].y - h[b].y);
    const size = d(0, 9);                                     // 手掌大小，用来抵消手离镜头远近的影响
    const ext = tip => d(0, tip) > d(0, tip - 2) * 1.15;      // 指尖比第二关节离手腕更远 = 手指伸直
    const [iE, mE, rE, pE] = [8, 12, 16, 20].map(ext);
    const pinchR = d(4, 8) / size;
    this.pts = h.map(this.map);
    return this.last = {
      p: this.pts[8],                                         // 食指指尖就是笔尖
      pinch: pinchR < 0.35,                                   // 拇指与食指相捏 = 落音
      open: iE && mE && rE && pE && pinchR > 0.6,             // 五指张开 = 和弦
      victory: iE && mE && !rE && !pE && pinchR > 0.5         // 比「耶」 = 曲终
    };
  },
  drawSkeleton() {
    if (!this.pts) return;
    const P = this.pts.map(q => Painter.toScreen(q));
    fctx.strokeStyle = 'rgba(236,228,211,0.16)'; fctx.lineWidth = 1;
    for (const [a, b] of HAND_LINKS) { fctx.beginPath(); fctx.moveTo(P[a].x, P[a].y); fctx.lineTo(P[b].x, P[b].y); fctx.stroke(); }
    fctx.fillStyle = 'rgba(236,228,211,0.35)';
    for (const q of P) { fctx.beginPath(); fctx.arc(q.x, q.y, 2, 0, 7); fctx.fill(); }
  }
};

// 3.2 鼠标 / 触屏：按住拖动 = 落音；空格或右键 = 和弦；回车 = 曲终
const Mouse = {
  p: null, down: false, tapped: false, chordFlag: false,
  read() {   // tapped 保证即使按下和松开发生在同一帧之内，这一下也不会丢
    const o = { p: this.p, pinch: this.down || this.tapped, open: this.chordFlag, victory: false };
    this.chordFlag = this.tapped = false; return o;
  }
};
addEventListener('pointermove', e => Mouse.p = { x: e.clientX / innerWidth, y: e.clientY / innerHeight });
addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.target.tagName !== 'CANVAS') return;
  Mouse.p = { x: e.clientX / innerWidth, y: e.clientY / innerHeight }; Mouse.down = Mouse.tapped = true;
});
addEventListener('pointerup', () => Mouse.down = false);
addEventListener('contextmenu', e => { e.preventDefault(); Mouse.chordFlag = true; });
addEventListener('keydown', e => {
  if (S.mode !== 'play') return;
  document.activeElement.blur();                // 防止空格误触发页面上的按钮
  if (e.code === 'Space') { e.preventDefault(); Mouse.chordFlag = true; }
  if (e.code === 'Enter') finish();
});

// 3.3 自动演奏：程序自己"挥手"。轨迹是两组不同频率正弦叠加的利萨如曲线，节奏来自一个十六拍的节奏型
const Auto = {
  t: 0, rhythm: [1,0,1,1, 0,1,1,0, 1,0,1,0, 1,1,1,0],
  read(dt) {
    const t = this.t += dt / 1000, beat = t / 0.3, b = Math.floor(beat);
    return {
      p: { x: 0.5 + 0.33 * Math.sin(t * 0.61) + 0.07 * Math.sin(t * 2.7),
           y: 0.5 + 0.3 * Math.sin(t * 0.83 + 0.6) + 0.07 * Math.cos(t * 2.1) },
      pinch: this.rhythm[b % 16] === 1 && beat - b < 0.5,
      open: b % 32 === 31 && beat - b < 0.3,
      victory: t > 28
    };
  }
};

/* ============================================================
 * 4. 录制与编码
 *    信笺要能"重放"整支曲子，又不想依赖服务器 —— 于是把曲子写进网址本身。
 *    每个采样点只占 4 个字节：[距上一点的时间, x, y, 状态位]
 *    状态位：最高位 = 是否按下，次高位 = 抬手，低 5 位 = 事件（1~15 单音，16~30 和弦）
 *    数据太长时，保留所有发声的点，其余的点隔一删一，直到能放进一个二维码。
 *    文字也转成 UTF-8 再做 base64，比百分号编码短一半多。
 * ============================================================ */
const b64u = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
const encText = t => b64u(new TextEncoder().encode(t));
const decText = s => new TextDecoder().decode(unb64u(s));

const Rec = {
  s: [], lastT: 0, lastSample: 0, lastPressed: false,
  reset(now) { this.s = []; this.lastT = this.lastSample = now; },
  push(now, p, pressed, ev, lift) {
    if (!lift && !ev && pressed === this.lastPressed && now - this.lastSample < 100) return;
    this.s.push({ dt: now - this.lastT, x: p ? p.x : 0, y: p ? p.y : 0, pressed, ev, lift });
    this.lastT = this.lastSample = now; this.lastPressed = pressed;
  },
  encode() {
    let s = this.s;
    while (s.length * 4 > 640) {
      const out = []; let carry = 0;
      s.forEach((e, i) => {
        if (e.ev || e.lift || i % 2 === 0) { out.push({ ...e, dt: e.dt + carry }); carry = 0; } else carry += e.dt;
      });
      if (out.length === s.length) break;
      s = out;
    }
    const b = new Uint8Array(s.length * 4);
    s.forEach((e, i) => {
      b[i * 4] = Math.min(255, Math.round(e.dt / 20));
      b[i * 4 + 1] = Math.round(e.x * 255); b[i * 4 + 2] = Math.round(e.y * 255);
      b[i * 4 + 3] = (e.pressed ? 128 : 0) | (e.lift ? 64 : 0) | e.ev;
    });
    return b64u(b);
  },
  decode(str) {
    const b = unb64u(str), s = []; let t = 0;
    for (let i = 0; i + 3 < b.length; i += 4) {
      const f = b[i + 3];
      t += b[i] * 20;
      s.push({ t, p: { x: b[i + 1] / 255, y: b[i + 2] / 255 }, pressed: !!(f & 128), lift: !!(f & 64), ev: f & 31 });
    }
    return s;
  }
};

/* ============================================================
 * 5. 信笺生成（1600×1000）
 *    左边是画，右边是信：题头与印章、称呼、寄语、落款、五声色谱、二维码。
 * ============================================================ */
async function renderCard(info) {
  const W = 1600, H = 1000, c = document.createElement('canvas'), g = c.getContext('2d');
  c.width = W; c.height = H;
  try { await document.fonts.load(`40px "Noto Serif SC"`, info.to + info.msg + info.from + '指尖交响奏致扫码听曲宫商角徵羽音秒' + CN); } catch (e) {}

  g.fillStyle = '#0b0e17'; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 16000; i++) { g.fillStyle = `rgba(236,228,211,${Math.random() * 0.03})`; g.fillRect(Math.random() * W, Math.random() * H, 1, 1); }

  // 画：裁成"窗"放在左边
  const win = { x: 64, y: 64, w: 1000, h: 872 }, v = Painter.view;
  const sx = v.x * DPR, sy = v.y * DPR, sw = v.w * DPR, sh = v.h * DPR;
  const sc = Math.max(win.w / sw, win.h / sh), dw = sw * sc, dh = sh * sc;
  g.save(); g.beginPath(); g.rect(win.x, win.y, win.w, win.h); g.clip();
  for (const layer of [bg, art]) g.drawImage(layer, sx, sy, sw, sh, win.x + (win.w - dw) / 2, win.y + (win.h - dh) / 2, dw, dh);
  g.restore();
  g.strokeStyle = 'rgba(214,182,118,0.45)'; g.lineWidth = 1; g.strokeRect(win.x - 0.5, win.y - 0.5, win.w + 1, win.h + 1);
  g.strokeStyle = 'rgba(214,182,118,0.28)'; g.strokeRect(28.5, 28.5, W - 57, H - 57);

  // 信
  const X = 1124, R = 1536;
  const font = (px, w = 400) => `${w} ${px}px ${SERIF}`;
  if ('letterSpacing' in g) g.letterSpacing = '8px';
  g.fillStyle = 'rgba(236,228,211,0.55)'; g.font = font(20); g.fillText('指尖交响', X, 122);
  if ('letterSpacing' in g) g.letterSpacing = '0px';
  g.fillStyle = '#b23a2e'; g.fillRect(R - 40, 94, 40, 40);
  g.strokeStyle = 'rgba(243,233,216,0.3)'; g.strokeRect(R - 36.5, 97.5, 33, 33);
  g.fillStyle = '#f3e9d8'; g.font = font(22); g.textAlign = 'center'; g.fillText('奏', R - 20, 122); g.textAlign = 'left';
  g.fillStyle = 'rgba(214,182,118,0.4)'; g.fillRect(X, 164, R - X, 1);

  g.fillStyle = '#e2c88f'; g.font = font(50, 600); g.fillText('致 ' + info.to, X, 248);
  g.fillStyle = '#ece4d3'; g.font = font(27);
  const y = wrapText(g, info.msg, X, 318, R - X, 48);
  g.textAlign = 'right'; g.fillStyle = 'rgba(236,228,211,0.75)'; g.font = font(23);
  g.fillText('—— ' + info.from, R, y + 66); g.textAlign = 'left';

  TONES.forEach((t, j) => {                    // 五声色谱：告诉读信的人，每种颜色是哪个音
    const x = X + j * 66;
    g.fillStyle = Painter.color(j + 5, 1); g.beginPath(); g.arc(x + 6, 552, 5, 0, 7); g.fill();
    g.fillStyle = 'rgba(236,228,211,0.6)'; g.font = font(19); g.fillText(t.name, x + 18, 559);
  });
  g.fillStyle = 'rgba(236,228,211,0.42)'; g.font = font(17);
  g.fillText(`${cnNum(info.notes)}音 · ${cnNum(info.secs)}秒`, X, 598);

  const qr = makeQR(info.url);
  if (qr) {                                   // 二维码按整数倍放大，保证每个格子清晰可扫
    const scale = clamp(Math.floor(300 / qr.width), 2, 4), s = qr.width * scale, pad = 4 * scale, qx = R - s - pad, qy = 936 - s - pad;
    g.fillStyle = '#f4efe4'; g.fillRect(qx - pad, qy - pad, s + pad * 2, s + pad * 2);   // 四格宽的留白，扫码更稳
    g.imageSmoothingEnabled = false; g.drawImage(qr, qx, qy, s, s); g.imageSmoothingEnabled = true;
    g.fillStyle = 'rgba(236,228,211,0.5)'; g.font = font(17); g.textAlign = 'center';
    [...'扫码听曲'].forEach((ch, j) => g.fillText(ch, qx - pad - 28, qy + 22 + j * 28));    // 竖排
    g.textAlign = 'left';
  }
  return c;
}
function wrapText(g, text, x, y, maxW, lh) {
  let line = '';
  for (const ch of text) {
    if (g.measureText(line + ch).width > maxW) { g.fillText(line, x, y); line = ch; y += lh; } else line += ch;
  }
  g.fillText(line, x, y);
  return y;
}
function makeQR(url) {
  try {
    const q = qrcode(0, 'L'); q.addData(url); q.make();
    const n = q.getModuleCount(), c = document.createElement('canvas'), g = c.getContext('2d');
    c.width = c.height = n; g.fillStyle = '#111';
    for (let r = 0; r < n; r++) for (let col = 0; col < n; col++) if (q.isDark(r, col)) g.fillRect(col, r, 1, 1);
    return c;
  } catch (e) { return null; }
}
const SHARE_SITE = 'https://edwardyu1596-maker.github.io/fingertip-symphony/';
async function showCard(info) {

/* ============================================================
 * 6. 主流程
 *    封面 → play（弹奏）→ done（写寄语）→ 信笺
 *    或者从带数据的链接进入：信封 → replay（回放）→ 信笺
 * ============================================================ */
const TIPS = {
  hand: '拇指食指相捏 · 落音        五指张开 · 和弦        比个「耶」停一秒 · 曲终',
  mouse: '按住拖动 · 落音        空格或右键 · 和弦        回车 · 曲终',
  auto: '它在自己弹 —— 一条正弦曲线，正替你挥手'
};

async function begin(kind) {
  Audio.init(); await Audio.ctx.resume();
  if (kind === 'hand') {
    $('#loading').textContent = '正在唤醒摄像头……';
    try { await Hand.start(); $('#cam').classList.add('on'); }
    catch (e) { console.error(e); toast('摄像头没有打开，先用鼠标弹吧'); kind = 'mouse'; }
  }
  S.src = { hand: Hand, mouse: Mouse, auto: Auto }[kind];
  Auto.t = 0;
  $('#tip').textContent = TIPS[kind];
  $('#start').hidden = true; $('#hud').hidden = false;
  document.activeElement.blur();
  actx.clearRect(0, 0, innerWidth, innerHeight);
  fitView(innerWidth / innerHeight);
  Object.assign(S, { mode: 'play', t0: performance.now(), notes: 0, smooth: null, lifted: true, vT: 0 });
  Rec.reset(performance.now());
}

// 把一个事件同时变成声音和画 —— 现场弹奏与回放共用这一个函数，两者因此完全一致
function apply(p, pressed, ev) {
  const step = stepOf(p.y), pan = (p.x - 0.5) * 1.4;
  Painter.stroke(p, step, pressed);
  if (ev >= 16) { Audio.chord(ev - 16, pan); Painter.burst(p, ev - 16); }
  else if (ev > 0) { Audio.note(ev - 1, 1, pan); Painter.bloom(p, ev - 1); }
  return step;
}

function handleInput(inp, now) {
  if (S.src === Hand) Hand.drawSkeleton();
  if (!inp || !inp.p) {                                   // 手离开画面：抬笔
    if (!S.lifted) { Rec.push(now, null, false, 0, true); Painter.lift(); S.lifted = true; }
    S.prevPinch = false; S.smooth = null; Painter.drawGuide(-1); return;
  }
  S.lifted = false;
  const a = S.src === Hand ? 0.5 : 1;                      // 对摄像头数据做平滑，消除抖动
  S.smooth = S.smooth ? { x: S.smooth.x + (inp.p.x - S.smooth.x) * a, y: S.smooth.y + (inp.p.y - S.smooth.y) * a } : { ...inp.p };
  const p = S.smooth, step = stepOf(p.y);

  // 落音规则：刚捏合时响一声；捏着滑到新的音高时再响一声（像手指拨过琴弦）
  let ev = 0;
  if (inp.pinch && (!S.prevPinch || (step !== S.lastStep && now - S.lastNoteT > 90))) ev = step + 1;
  if (inp.open && !S.prevOpen) ev = 16 + step;
  if (ev) { S.lastNoteT = now; S.lastStep = step; S.notes++; }
  apply(p, inp.pinch, ev);
  Rec.push(now, p, inp.pinch, ev, false);
  S.prevPinch = inp.pinch; S.prevOpen = inp.open;

  if (inp.victory) { S.vT = S.vT || now; if (now - S.vT > 900) return finish(); } else S.vT = 0;
  Painter.drawGuide(step);
  Painter.drawCursor(p, step, inp.pinch, S.vT ? (now - S.vT) / 900 : 0);
}

function finish() {
  if (S.mode !== 'play') return;
  S.mode = 'done'; Painter.lift();
  [0, 2, 4, 7, 10].forEach((n, j) => Audio.note(n, 0.8, 0, j * 0.12));   // 收尾的上行琶音
  S.secs = Math.round((performance.now() - S.t0) / 1000);
  $('#formStat').textContent = `这一曲共${cnNum(S.notes)}个音，历时${cnNum(S.secs)}秒。`;
  $('#hud').hidden = true; $('#form').hidden = false;
}

$('#makeCard').onclick = () => {
  const to = $('#fTo').value.trim() || '你', msg = $('#fMsg').value.trim() || '愿你安好。', from = $('#fFrom').value.trim() || '我';
  const data = ['v2', Math.round(Painter.view.w / Painter.view.h * 100), Rec.encode(), encText(to), encText(msg), encText(from)].join('.');
  showCard({ to, msg, from, notes: S.notes, secs: S.secs, url: location.href.split('#')[0] + '#' + data });
};

// 从链接打开：解析网址里的曲子，先显示信封；点"拆开"后开始回放（浏览器要求点击之后才能发声）
// 两种格式：v2（当前，文字用 base64）与 v1（早期，用逗号和百分号编码），已发出的旧链接仍能打开
function tryReplay() {
  const raw = location.hash.slice(1), v1 = raw.startsWith('v1,');
  if (!v1 && !raw.startsWith('v2.')) return false;
  const parts = raw.split(v1 ? ',' : '.');
  if (parts.length < 6) return false;
  let samples, to, msg, from;
  try { samples = Rec.decode(parts[2]); [to, msg, from] = parts.slice(3, 6).map(v1 ? decodeURIComponent : decText); } catch (e) { return false; }
  S.aspect = (+parts[1] || 178) / 100;
  $('#start').hidden = true; $('#env').hidden = false;
  $('#envTitle').textContent = '致 ' + to;
  $('#envDesc').innerHTML = '';
  $('#envDesc').append(`${from}用指尖为你弹了一支曲子，`, document.createElement('br'), '也把它画了下来。');
  $('#openBtn').onclick = () => openSharedSong(async () => {
    Audio.init(); await unlockAudio(Audio.ctx);
    $('#env').hidden = true; S.mode = 'replay'; fitView(S.aspect);
    const t0 = performance.now(), end = samples.length ? samples[samples.length - 1].t : 0;
    let idx = 0;
    S.replay = now => {
      const rt = now - t0;
      while (idx < samples.length && samples[idx].t <= rt) {
        const s = samples[idx++];
        if (s.lift) Painter.lift(); else apply(s.p, s.pressed, s.ev);
        S.cur = s;
      }
      if (S.cur && !S.cur.lift) Painter.drawCursor(S.cur.p, stepOf(S.cur.p.y), S.cur.pressed, 0);
      if (rt > end + 2500) {
        S.mode = 'done';
        showCard({ to, msg, from, notes: samples.filter(s => s.ev).length, secs: Math.round(end / 1000), url: location.href });
        document.querySelectorAll('.again').forEach(b => b.textContent = '我也弹一首');
      }
    };
  });
  return true;
}

document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => begin(b.dataset.mode));
document.querySelectorAll('.again').forEach(b => b.onclick = () => { history.replaceState(null, '', location.href.split('#')[0]); location.reload(); });
$('#doneBtn').onclick = finish;

let lastFrame = performance.now();
function frame(now) {
  const dt = Math.min(50, now - lastFrame); lastFrame = now;
  fctx.clearRect(0, 0, innerWidth, innerHeight);
  if (S.mode === 'play') {
    handleInput(S.src.read(dt), now);
    const sec = Math.floor((now - S.t0) / 1000);
    $('#stat').textContent = `第 ${S.notes} 音　${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
  } else if (S.mode === 'replay') S.replay(now);
  Painter.updateFx();
  requestAnimationFrame(frame);
}

addEventListener('resize', resize);
resize();
tryReplay();
requestAnimationFrame(frame);
</script>
